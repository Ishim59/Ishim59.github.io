<dialog id="search-dialog">
  <div class="dialog-head">
    <h2>Найти раздел</h2>
    <button id="search-close" class="icon-button" aria-label="Закрыть поиск">×</button>
  </div>
  <label for="search-input">Что вы ищете?</label>
  <input
    id="search-input"
    type="search"
    placeholder="Например, расписание или документы"
    autocomplete="off"
  />
  <div id="search-results" aria-live="polite"></div>
</dialog>
